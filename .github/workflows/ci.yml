name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic
          POSTGRES_DB: agentic
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agentic -d agentic"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e '.[dev]' pip-audit

      - name: Lint
        run: ruff check src tests

      - name: Tests
        env:
          DATABASE_URL: postgresql+psycopg://agentic:agentic@localhost:5432/agentic
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q

      - name: Dependency audit
        run: pip-audit --progress-spinner off

      - name: Retrieval evaluation gate
        run: >-
          python -m agentic_ai.evaluation.cli
          --cases data/evaluation/retrieval_cases.jsonl
          --predictions data/evaluation/retrieval_smoke_predictions.jsonl
          --output retrieval-evaluation.json
          --k 5
          --min-recall-at-k 1.0
          --max-forbidden-retrieval-rate 0.0
          --max-p95-latency-ms 100

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: retrieval-evaluation.json

  container:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build --tag enterprise-agentic-operations-platform:${{ github.sha }} .
